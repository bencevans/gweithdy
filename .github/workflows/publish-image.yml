name: Publish container image

on:
  pull_request:
    paths:
      - Dockerfile
      - entrypoint.sh
      - codex-runai.toml
      - tests/test_ai_agents.sh
      - .github/workflows/publish-image.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - codex-runai.toml
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-codex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native test image
        run: docker build -t gweithdy-test .
      - name: Exercise Codex in a restricted container
        run: IMAGE=gweithdy-test bash tests/test_ai_agents.sh

  build-and-push:
    if: github.event_name != 'pull_request'
    needs: test-codex
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: set-tags
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY}
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="$IMAGE:${GITHUB_SHA},$IMAGE:latest"
          else
            TAGS="$IMAGE:${GITHUB_SHA}"
          fi
          echo "TAGS=$TAGS" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.TAGS }}
          platforms: linux/amd64,linux/arm64
